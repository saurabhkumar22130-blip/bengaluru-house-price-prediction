<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Enterprise Secure | Sign Up</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .material-symbols-outlined {
            vertical-align: middle;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-gradient-to-br from-blue-100 via-indigo-50 to-purple-100 text-gray-900">
    <!-- Header -->
    <header class="w-full bg-white/40 backdrop-blur-md border-b border-white/40 z-50">
        <div class="flex items-center justify-center h-16 w-full max-w-7xl mx-auto px-4">
            <div class="flex items-center gap-2 cursor-pointer transition-transform hover:opacity-80">
                <span class="material-symbols-outlined text-indigo-600">shield</span>
                <span class="text-xl font-bold text-gray-900 tracking-tight">Enterprise Secure</span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center px-4 py-12">
        <div class="w-full max-w-md bg-white/70 backdrop-blur-xl border border-white/60 p-8 md:p-10 shadow-2xl rounded-3xl transition-all duration-300 opacity-0 translate-y-4" id="auth-card">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-gray-900 mb-2 tracking-tight">Create an Account</h1>
                <p class="text-sm text-gray-600">Register to access your secure terminal</p>
            </div>

            {% if error %}
            <div class="mb-6 p-3 bg-red-50/90 border border-red-200 text-red-700 text-sm text-center rounded-xl">
                {{ error }}
            </div>
            {% endif %}

            <form action="/signup" method="POST" class="space-y-6">
                <!-- Username -->
                <div class="space-y-1">
                    <label for="username" class="block text-sm font-medium text-gray-700 ml-1">Username</label>
                    <div class="relative group">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400 group-focus-within:text-indigo-600 transition-colors">
                            <span class="material-symbols-outlined text-[20px]">person</span>
                        </div>
                        <input type="text" id="username" name="username" required placeholder="Choose a username" 
                               class="block w-full pl-10 pr-4 py-3 bg-white/80 border border-white/40 text-gray-900 placeholder:text-gray-400 focus:outline-none focus:border-indigo-400 focus:ring-4 focus:ring-indigo-500/10 transition-all rounded-xl shadow-sm" />
                    </div>
                </div>

                <!-- Password -->
                <div class="space-y-1">
                    <label for="password" class="block text-sm font-medium text-gray-700 ml-1">Password</label>
                    <div class="relative group">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400 group-focus-within:text-indigo-600 transition-colors">
                            <span class="material-symbols-outlined text-[20px]">lock</span>
                        </div>
                        <input type="password" id="password" name="password" required placeholder="Create a password" 
                               class="block w-full pl-10 pr-12 py-3 bg-white/80 border border-white/40 text-gray-900 placeholder:text-gray-400 focus:outline-none focus:border-indigo-400 focus:ring-4 focus:ring-indigo-500/10 transition-all rounded-xl shadow-sm" />
                        <button type="button" onclick="togglePassword()" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-indigo-600 transition-colors">
                            <span class="material-symbols-outlined text-[20px]" id="pw-toggle-icon">visibility</span>
                        </button>
                    </div>
                </div>

                <!-- Confirm Password -->
                <div class="space-y-1">
                    <label for="confirm_password" class="block text-sm font-medium text-gray-700 ml-1">Confirm Password</label>
                    <div class="relative group">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400 group-focus-within:text-indigo-600 transition-colors">
                            <span class="material-symbols-outlined text-[20px]">lock_reset</span>
                        </div>
                        <input type="password" id="confirm_password" name="confirm_password" required placeholder="Confirm your password" 
                               class="block w-full pl-10 pr-12 py-3 bg-white/80 border border-white/40 text-gray-900 placeholder:text-gray-400 focus:outline-none focus:border-indigo-400 focus:ring-4 focus:ring-indigo-500/10 transition-all rounded-xl shadow-sm" />
                    </div>
                </div>

                <!-- Role -->
                <div class="space-y-2">
                    <label class="block text-sm font-medium text-gray-700 ml-1">Account Type</label>
                    <div class="flex gap-6 pl-1">
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="radio" name="role" value="user" checked class="w-4 h-4 text-indigo-600 border-gray-300 focus:ring-indigo-500">
                            <span class="text-sm text-gray-700 font-medium">User</span>
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="radio" name="role" value="broker" class="w-4 h-4 text-indigo-600 border-gray-300 focus:ring-indigo-500">
                            <span class="text-sm text-gray-700 font-medium">Broker</span>
                        </label>
                    </div>
                </div>

                <div class="pt-4">
                    <button type="submit" class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 text-white py-3.5 font-semibold hover:from-indigo-700 hover:to-purple-700 hover:shadow-lg hover:-translate-y-0.5 transition-all focus:outline-none focus:ring-4 focus:ring-indigo-500/30 rounded-xl">
                        Sign Up
                    </button>
                </div>
            </form>

            <div class="mt-8 text-center">
                <p class="text-sm text-gray-600">Already have an account? <a href="/login" class="text-indigo-600 font-semibold hover:text-purple-700 hover:underline transition-colors">Login</a></p>
            </div>

            <div class="mt-8 pt-6 border-t border-gray-200/50 text-center">
                <div class="flex items-center justify-center gap-2 text-gray-500">
                    <span class="material-symbols-outlined text-[16px]">verified_user</span>
                    <span class="text-xs tracking-wide uppercase font-medium">AES-256 Encrypted</span>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full bg-white/40 backdrop-blur-md border-t border-white/40 mt-auto">
        <div class="flex flex-col md:flex-row items-center justify-between py-6 max-w-7xl mx-auto px-4 text-xs text-gray-600">
            <span>© 2024 Enterprise Systems. All rights reserved.</span>
            <div class="flex gap-4 mt-4 md:mt-0">
                <a href="#" class="hover:text-indigo-600 transition-colors">Privacy Policy</a>
                <a href="#" class="hover:text-indigo-600 transition-colors">Terms of Service</a>
            </div>
        </div>
    </footer>

    <script>
        function togglePassword() {
            const pwInput = document.getElementById('password');
            const icon = document.getElementById('pw-toggle-icon');
            if (pwInput.type === 'password') {
                pwInput.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                pwInput.type = 'password';
                icon.textContent = 'visibility';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const card = document.getElementById('auth-card');
            setTimeout(() => {
                card.style.opacity = '1';
                card.style.transform = 'translateY(0)';
            }, 50);
        });
    </script>
</body>
</html>
