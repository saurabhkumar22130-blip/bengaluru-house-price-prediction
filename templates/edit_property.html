<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>Broker Portal | Edit Property</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#003d9b',
                        surface: '#faf9ff',
                        'on-surface': '#191c20',
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #faf9ff; }
        .material-symbols-outlined { vertical-align: middle; }
    </style>
</head>
<body class="min-h-screen pb-24 relative overflow-x-hidden text-[#191c20]">
    <!-- Abstract Background -->
    <div class="fixed top-0 left-0 w-full h-[40vh] bg-gradient-to-br from-primary/10 via-[#d8e2ff] to-[#faf9ff] z-[-1] rounded-b-[40px] opacity-70"></div>

    <!-- Header Section -->
    <header class="pt-10 pb-4 px-6 relative">
        <div class="flex justify-between items-center">
            <div>
                <h1 class="text-3xl font-bold tracking-tight text-primary">Edit Listing</h1>
                <p class="text-gray-500 mt-1 text-sm font-medium">Update property details</p>
            </div>
            <a href="/profile" class="w-10 h-10 rounded-full bg-white shadow-sm flex items-center justify-center text-gray-500 hover:text-primary transition-colors border border-gray-100">
                <span class="material-symbols-outlined text-[20px]">close</span>
            </a>
        </div>
    </header>

    <main class="px-6 space-y-6 max-w-3xl mx-auto">
        <form action="/edit_property/{{ prop.id }}" method="POST" enctype="multipart/form-data" class="space-y-6">
            <!-- Image Upload with Preview -->
            <div class="bg-white p-5 rounded-3xl shadow-sm border border-gray-100">
                <h3 class="text-lg font-bold mb-3">Property Media</h3>
                
                <div class="relative w-full h-56 rounded-2xl border-2 border-dashed border-gray-300 hover:border-primary transition-colors bg-gray-50 flex flex-col items-center justify-center overflow-hidden group cursor-pointer" onclick="document.getElementById('images').click()">
                    
                    <img id="imagePreview" src="{{ prop.image_url }}" class="absolute inset-0 w-full h-full object-cover z-10" />
                    
                    <div id="uploadPrompt" class="text-center z-20 relative bg-black/50 backdrop-blur-sm w-full h-full flex flex-col justify-center items-center absolute inset-0 transition-all opacity-0 group-hover:opacity-100">
                        <div class="w-12 h-12 bg-white/20 rounded-full flex items-center justify-center mx-auto mb-2 text-white group-hover:scale-110 transition-transform">
                            <span class="material-symbols-outlined text-[28px]">add_photo_alternate</span>
                        </div>
                        <p class="text-sm font-semibold text-white">Tap to change photo</p>
                        <p class="text-xs text-white/80 mt-1">Leave blank to keep current photo</p>
                    </div>
                    <input id="images" name="images" type="file" class="hidden" accept="image/*" onchange="previewImage(event)">
                </div>
            </div>

            <!-- Property Details -->
            <div class="bg-white p-5 rounded-3xl shadow-sm border border-gray-100 space-y-4">
                <h3 class="text-lg font-bold mb-2">Property Details</h3>
                
                <div>
                    <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1 ml-1">Location</label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">location_on</span>
                        <input type="text" name="location" value="{{ prop.location }}" required placeholder="e.g. Whitefield, Bangalore" class="w-full pl-10 pr-4 py-3.5 bg-gray-50 border-none rounded-xl text-sm focus:ring-2 focus:ring-primary shadow-inner">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1 ml-1">Area (sqft)</label>
                        <div class="relative">
                            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">straighten</span>
                            <input type="number" name="area" value="{{ prop.area }}" required placeholder="1500" class="w-full pl-10 pr-4 py-3.5 bg-gray-50 border-none rounded-xl text-sm focus:ring-2 focus:ring-primary shadow-inner">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1 ml-1">Bedrooms</label>
                        <div class="relative">
                            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">bed</span>
                            <select name="bedroom" class="w-full pl-10 pr-4 py-3.5 bg-gray-50 border-none rounded-xl text-sm focus:ring-2 focus:ring-primary shadow-inner appearance-none cursor-pointer">
                                <option value="1" {% if prop.bedrooms == '1' %}selected{% endif %}>1 BHK</option>
                                <option value="2" {% if prop.bedrooms == '2' %}selected{% endif %}>2 BHK</option>
                                <option value="3" {% if prop.bedrooms == '3' %}selected{% endif %}>3 BHK</option>
                                <option value="4" {% if prop.bedrooms == '4' %}selected{% endif %}>4 BHK</option>
                                <option value="5+" {% if prop.bedrooms == '5+' %}selected{% endif %}>5+ BHK</option>
                            </select>
                            <span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none">expand_more</span>
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1 ml-1">Asking Price (Rupees)</label>
                    <div class="relative">
                        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 font-semibold text-lg">₹</span>
                        <input type="text" name="price" value="{{ prop.price or '' }}" required placeholder="e.g. 12 Lakh" class="w-full pl-10 pr-4 py-3.5 bg-gray-50 border-none rounded-xl text-sm focus:ring-2 focus:ring-primary shadow-inner">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1 ml-1">Contact Number</label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">call</span>
                        <input type="tel" name="contact" value="{{ prop.contact }}" required placeholder="+91 xxxxx xxxxx" class="w-full pl-10 pr-4 py-3.5 bg-gray-50 border-none rounded-xl text-sm focus:ring-2 focus:ring-primary shadow-inner">
                    </div>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="w-full bg-primary hover:bg-primary/90 text-white rounded-2xl py-4 font-bold text-lg shadow-[0_8px_20px_rgba(0,61,155,0.2)] transition-all active:scale-95 flex items-center justify-center gap-2">
                <span class="material-symbols-outlined text-[20px]">save</span> Save Changes
            </button>
        </form>
    </main>

    <!-- Bottom Nav Bar -->
    <nav class="fixed bottom-0 left-0 w-full z-[1000] flex justify-around items-center px-4 py-2 pb-safe bg-black/50 backdrop-blur-xl border-t border-white/10 shadow-[0px_-4px_20px_rgba(0,0,0,0.3)]">
        <a class="flex flex-col items-center justify-center text-white/70 p-2 transition-all active:scale-95 hover:text-white" href="{{ url_for('logout') }}">
            <span class="material-symbols-outlined">login</span>
            <span class="text-[10px] font-medium mt-1">Login</span>
        </a>
        
        <a class="flex flex-col items-center justify-center text-white/70 p-2 transition-all active:scale-95 hover:text-white" href="{{ url_for('broker_upload') }}">
            <span class="material-symbols-outlined">add_business</span>
            <span class="text-[10px] font-medium mt-1">New Listing</span>
        </a>
        
        <a class="flex flex-col items-center justify-center bg-white/20 text-white rounded-2xl px-4 py-1.5 transition-all duration-300 active:scale-95 shadow-sm border border-white/20" href="{{ url_for('profile') }}">
            <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">account_circle</span>
            <span class="text-[10px] font-medium mt-1">Profile</span>
        </a>
    </nav>

    <script>
        function previewImage(event) {
            const input = event.target;
            const preview = document.getElementById('imagePreview');
            const prompt = document.getElementById('uploadPrompt');
            
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    prompt.classList.remove('opacity-0');
                }
                reader.readAsDataURL(input.files[0]);
            }
        }
    </script>

</body>
</html>
