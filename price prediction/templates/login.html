<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Enterprise Secure | Login</title>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Google Fonts: Inter -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f9fb76; /* background color from config */
        }

        /* Ambient Shadows as per Style Guidance */
        .ambient-shadow {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }

        /* Custom Transition for Focus Halo */
        .input-focus-halo:focus-within {
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "tertiary-fixed-dim": "#ffb596",
                      "on-secondary": "#ffffff",
                      "on-secondary-fixed": "#0b1c30",
                      "on-tertiary-container": "#ffede6",
                      "inverse-on-surface": "#eff1f3",
                      "tertiary-fixed": "#ffdbcd",
                      "on-primary-container": "#eeefff",
                      "secondary": "#505f76",
                      "on-error": "#ffffff",
                      "primary-fixed": "#dbe1ff",
                      "primary-container": "#2563eb",
                      "surface-container-high": "#e6e8ea",
                      "surface-dim": "#d8dadc",
                      "on-surface": "#191c1e",
                      "surface-container": "#eceef0",
                      "outline-variant": "#c3c6d7",
                      "on-error-container": "#93000a",
                      "tertiary": "#943700",
                      "background": "#f7f9fb",
                      "error": "#ba1a1a",
                      "surface-container-lowest": "#ffffff",
                      "surface-container-highest": "#e0e3e5",
                      "surface": "#f7f9fb",
                      "on-secondary-fixed-variant": "#38485d",
                      "on-surface-variant": "#434655",
                      "tertiary-container": "#bc4800",
                      "on-background": "#191c1e",
                      "outline": "#737686",
                      "on-tertiary": "#ffffff",
                      "surface-variant": "#e0e3e5",
                      "on-tertiary-fixed-variant": "#7d2d00",
                      "secondary-container": "#d0e1fb",
                      "primary": "#004ac6",
                      "secondary-fixed": "#d3e4fe",
                      "surface-tint": "#0053db",
                      "error-container": "#ffdad6",
                      "primary-fixed-dim": "#b4c5ff",
                      "on-tertiary-fixed": "#360f00",
                      "on-secondary-container": "#54647a",
                      "on-primary-fixed": "#00174b",
                      "surface-container-low": "#f2f4f6",
                      "surface-bright": "#f7f9fb",
                      "inverse-primary": "#b4c5ff",
                      "on-primary": "#ffffff",
                      "inverse-surface": "#2d3133",
                      "on-primary-fixed-variant": "#003ea8",
                      "secondary-fixed-dim": "#b7c8e1"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "2xl": "1rem",
                      "full": "9999px"
              },
              "spacing": {
                      "gutter": "1rem",
                      "margin-mobile": "1.25rem",
                      "container-max-width": "440px",
                      "unit": "4px",
                      "stack-gap": "1.5rem"
              },
              "fontFamily": {
                      "headline-lg-mobile": ["Inter"],
                      "headline-lg": ["Inter"],
                      "body-md": ["Inter"],
                      "label-sm": ["Inter"],
                      "title-md": ["Inter"],
                      "body-lg": ["Inter"],
                      "label-md": ["Inter"],
                      "display": ["Inter"]
              },
              "fontSize": {
                      "headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                      "headline-lg": ["28px", {"lineHeight": "36px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                      "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                      "label-sm": ["12px", {"lineHeight": "16px", "fontWeight": "600"}],
                      "title-md": ["18px", {"lineHeight": "24px", "fontWeight": "600"}],
                      "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                      "label-md": ["14px", {"lineHeight": "20px", "fontWeight": "500"}],
                      "display": ["36px", {"lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700"}]
              }
            },
          },
        }
      </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col"><div class="fixed inset-0 z-[-1] overflow-hidden">
<img alt="Professional modern office building background" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuChe-Ud-zbi1zt5vN52ptTPNx6Wdw6EdWiOOJ2eRUhk0XjKJjLYWhlGzOCooeCj-QAVVMYue3wNXmUYwZK9nWFLG99uIHHk-jJNuhqZMwJfeAATV0vXky3FqQNAfIvoo6LCvJzt_iXRsX6SGhJG79-9eA1B8HG95NT7E9RCWfL14lESeXEbXvI1y_o1Ii2EqW6vk8f8dx0JX2cZRbGoZoPYRChXC3uMBI9jAaeHx_PZ3K35YKERlHVY5dNR1OqbTubg7aIaV0UzFGQ"/>
<div class="absolute inset-0 bg-surface/60 backdrop-blur-sm"></div>
</div>
<!-- TopAppBar - Mapped from Shared Components JSON -->
<header class="fixed top-0 w-full dark:bg-on-surface-fixed dark:shadow-none z-50">
<div class="flex items-center justify-center px-gutter h-16 w-full max-w-7xl mx-auto">
<div class="flex items-center gap-2 cursor-pointer active:scale-95 transition-transform">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed-dim" data-icon="shield">shield</span>
<span class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary dark:text-primary-fixed-dim">Enterprise Secure</span>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center px-margin-mobile pt-16 pb-24">
<!-- Login Card -->
<div class="w-full max-w-container-max-width bg-surface-container-lowest rounded-2xl ambient-shadow p-8 md:p-10 transition-all duration-300">
<!-- Heading -->
<div class="text-center mb-8">
<h1 class="font-headline-lg text-headline-lg text-primary mb-2">Welcome Back</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Please sign in to your secure terminal</p>
</div>
<!-- Login Form -->
<form action="/login" class="space-y-stack-gap" method="POST">
<!-- Username Field -->
<div class="space-y-1">
<label class="font-label-md text-label-md text-on-surface-variant block ml-1" for="username">Username</label>
<div class="relative group input-focus-halo rounded-xl transition-all duration-200">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined" data-icon="person">person</span>
</div>
<input class="block w-full pl-10 pr-4 py-3 bg-white border border-outline-variant rounded-xl font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:ring-0 transition-all" id="username" name="username" placeholder="Enter your username" required="" type="text"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-1">
<label class="font-label-md text-label-md text-on-surface-variant block ml-1" for="password">Password</label>
<div class="relative group input-focus-halo rounded-xl transition-all duration-200">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-outline group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined" data-icon="lock">lock</span>
</div>
<input class="block w-full pl-10 pr-12 py-3 bg-white border border-outline-variant rounded-xl font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:ring-0 transition-all" id="password" name="password" placeholder="Enter your password" required="" type="password"/>
<!-- Password Visibility Toggle (Micro-interaction) -->
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-outline hover:text-on-surface-variant transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined" data-icon="visibility" id="pw-toggle-icon">visibility</span>
</button>
</div>
</div>
<!-- Submit Button -->
<div class="pt-2">
<button class="w-full bg-primary-container text-on-primary py-4 rounded-xl font-title-md text-title-md font-bold shadow-md hover:shadow-lg hover:scale-[1.02] active:scale-[0.98] transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2" type="submit">
                        Login
                    </button>
</div>
</form>
<!-- Bottom Note -->
<div class="mt-10 pt-6 border-t border-surface-container-high text-center">
<div class="flex items-center justify-center gap-2 text-on-surface-variant opacity-60">
<span class="material-symbols-outlined text-[18px]" data-icon="verified_user">verified_user</span>
<span class="font-label-sm text-label-sm">AES-256 Encrypted Connection</span>
</div>
</div>
</div>
</main>
<!-- Footer - Mapped from Shared Components JSON -->
<footer class="fixed bottom-0 w-full bg-transparent z-40">
<div class="flex flex-col md:flex-row items-center justify-center gap-4 py-8 w-full max-w-7xl mx-auto px-gutter">
<span class="font-label-md text-label-md font-semibold text-on-surface">© 2024 Enterprise Systems. All rights reserved.</span>
<div class="flex gap-6">
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-colors" href="#">Privacy Policy</a>
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-colors" href="#">Terms of Service</a>
</div>
</div>
</footer>
<!-- Micro-interactions Script -->
<script>
        function togglePassword() {
            const pwInput = document.getElementById('password');
            const icon = document.getElementById('pw-toggle-icon');
            if (pwInput.type === 'password') {
                pwInput.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                pwInput.type = 'password';
                icon.textContent = 'visibility';
            }
        }

        // Add a subtle entrance animation for the card
        document.addEventListener('DOMContentLoaded', () => {
            const card = document.querySelector('.bg-surface-container-lowest');
            card.style.opacity = '0';
            card.style.transform = 'translateY(20px)';
            
            setTimeout(() => {
                card.style.transition = 'all 0.6s cubic-bezier(0.16, 1, 0.3, 1)';
                card.style.opacity = '1';
                card.style.transform = 'translateY(0)';
            }, 100);
        });
    </script>
</body></html>
